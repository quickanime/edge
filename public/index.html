<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Edge — end-to-end encrypted team messaging, voice and video calls, tasks and meetings.">
  <title>Edge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ============ giris / kayit ============ -->
  <main id="gate" class="gate">
    <div class="gate-grid">
      <section class="gate-hero">
        <div class="hero-mark">
          <img src="/logo.svg" alt="" width="64" height="64">
        </div>
        <h1>Edge</h1>
        <p class="hero-lead" data-i18n="hero_lead"></p>
        <ul class="hero-list">
          <li><span class="hero-ico" data-ico="lock"></span><div><strong data-i18n="hero_e2e"></strong><small data-i18n="hero_e2e_sub"></small></div></li>
          <li><span class="hero-ico" data-ico="video"></span><div><strong data-i18n="hero_call"></strong><small data-i18n="hero_call_sub"></small></div></li>
          <li><span class="hero-ico" data-ico="users"></span><div><strong data-i18n="hero_org"></strong><small data-i18n="hero_org_sub"></small></div></li>
          <li><span class="hero-ico" data-ico="check"></span><div><strong data-i18n="hero_work"></strong><small data-i18n="hero_work_sub"></small></div></li>
        </ul>
      </section>

      <section class="gate-card">
        <header class="gate-head">
          <img src="/logo.svg" alt="" class="gate-logo" width="44" height="44">
          <h2 data-i18n="welcome"></h2>
          <p class="muted" data-i18n="welcome_sub"></p>
        </header>

        <div id="gate-invite" class="gate-invite is-hidden"></div>

        <div id="gate-tabs" class="tabs" role="tablist">
          <button class="tab is-active" data-gate-tab="login" role="tab" type="button" data-i18n="tab_login"></button>
          <button class="tab" data-gate-tab="register" role="tab" type="button" data-i18n="tab_register"></button>
        </div>

        <form id="login-form" class="form">
          <label class="field">
            <span data-i18n="nick"></span>
            <input name="nick" autocomplete="username" data-i18n-ph="nick" required>
          </label>
          <label class="field">
            <span data-i18n="password"></span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="sign_in"></button>
        </form>

        <form id="register-form" class="form is-hidden">
          <label class="field">
            <span data-i18n="nick"></span>
            <input name="nick" autocomplete="username" data-i18n-ph="nick" required>
            <small class="muted" data-i18n="nick_hint"></small>
          </label>
          <label class="field">
            <span data-i18n="display_name"></span>
            <input name="displayName" data-i18n-ph="optional">
          </label>
          <label class="field">
            <span data-i18n="password"></span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
            <small class="muted" data-i18n="password_hint"></small>
          </label>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="create_account"></button>
        </form>

        <form id="unlock-form" class="form is-hidden">
          <p class="muted" data-i18n="locked_note"></p>
          <label class="field">
            <span data-i18n="password"></span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="unlock"></button>
          <button class="btn btn-ghost btn-block" type="button" data-action="sign-out" data-i18n="sign_out"></button>
        </form>

        <p id="gate-error" class="error" role="alert"></p>
        <p class="gate-foot muted" data-i18n="gate_foot"></p>
      </section>
    </div>
  </main>

  <!-- ============ uygulama ============ -->
  <div id="app" class="app is-hidden">
    <nav class="rail">
      <img src="/logo.svg" alt="Edge" class="rail-logo" width="28" height="28">
      <button class="rail-btn is-active" data-nav="dm" data-i18n-title="nav_messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
      </button>
      <button class="rail-btn" data-nav="friends" data-i18n-title="nav_friends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1a4 4 0 00-4-4H6a4 4 0 00-4 4v1M8.5 6.5a2.5 2.5 0 105 0 2.5 2.5 0 10-5 0M18 8v6M15 11h6"/></svg>
      </button>
      <button class="rail-btn" data-nav="tasks" data-i18n-title="nav_tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h11M4 17h7M18 6l2 2 3-3"/></svg>
      </button>
      <button class="rail-btn" data-nav="meetings" data-i18n-title="nav_meetings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM8 3v4M16 3v4M4 11h16"/></svg>
      </button>
      <div class="rail-sep"></div>
      <div id="rail-companies" class="rail-companies"></div>
      <button class="rail-btn rail-add" data-action="new-company" data-i18n-title="nav_new_company">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="rail-btn rail-profile" data-action="profile" data-i18n-title="nav_profile">
        <span id="rail-me"></span>
      </button>
    </nav>

    <aside class="side">
      <header class="side-head">
        <h2 id="side-title" data-i18n="nav_messages"></h2>
        <button class="icon-btn" data-action="new-dm" data-i18n-title="new_chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="side-search">
        <input id="side-filter" type="search" data-i18n-ph="search" autocomplete="off">
      </div>
      <div id="side-list" class="side-list"></div>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <!-- ============ katmanlar ============ -->
  <div id="ring" class="ring is-hidden" role="alert"></div>

  <div id="modal" class="modal is-hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" data-action="close-modal" data-i18n-title="close" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast is-hidden" role="status"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
