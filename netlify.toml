[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Edge statik olarak yayinlanir; derleme adimi yok.'"

[functions]
  node_bundler = "esbuild"

# API ve kimlik uc noktalari tek isleve gider.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200
  force = true

# Davet linkleri (ornek: /vertex) ve diger tum yollar uygulamayi acar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
